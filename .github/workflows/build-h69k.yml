name: Build H69K Custom KWRT

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  KWRT_REPO: https://github.com/kiddin9/Kwrt.git
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: openwrt-25.12

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout customization
        uses: actions/checkout@v5

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache \
            rename libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev

      - name: Fetch KWRT and OpenWrt base
        run: |
          git clone --depth=1 "$KWRT_REPO" kwrt
          git clone --depth=1 --branch "$OPENWRT_BRANCH" "$OPENWRT_REPO" openwrt

      - name: Apply KWRT H69K target and customization
        run: |
          set -euo pipefail
          function git_clone_path() {
            local branch="$1" repo="$2" mode="$3" root tmp
            if [ "$mode" != mv ]; then shift 2; else shift 3; fi
            root="$PWD"
            tmp="$(mktemp -d)"
            if [ ${#branch} -lt 10 ]; then
              git clone --depth=1 --branch "$branch" --filter=blob:none --sparse "$repo" "$tmp"
            else
              git clone --filter=blob:none --sparse "$repo" "$tmp"
              git -C "$tmp" checkout "$branch"
            fi
            git -C "$tmp" sparse-checkout set "$@"
            if [ "$mode" != mv ]; then
              cp -rn "$tmp"/* "$root"/
            else
              for path in "$@"; do
                mkdir -p "$root/$path"
                mv "$tmp/$path"/* "$root/$path"/
              done
            fi
            rm -rf "$tmp"
          }
          export -f git_clone_path

          cp -a kwrt/devices/common/. openwrt/
          cp -a kwrt/devices/rockchip_armv8/. openwrt/
          cp -a kwrt/devices openwrt/devices
          mkdir -p openwrt/custom
          cp -a diy.sh h69k-kwrt.config verify-config.sh files openwrt/custom/

          cd openwrt
          chmod +x devices/common/diy.sh devices/rockchip_armv8/diy.sh custom/diy.sh custom/verify-config.sh
          ./devices/common/diy.sh
          cp devices/common/.config .config
          cat devices/rockchip_armv8/.config >> .config
          ./devices/rockchip_armv8/diy.sh
          ./custom/diy.sh
          cat custom/h69k-kwrt.config >> .config

          find devices/rockchip_armv8/patches -maxdepth 1 -type f -name '*.patch' -print0 | \
            sort -z | xargs -0 -r -n1 patch -p1 -F1 -i

      - name: Resolve and validate configuration
        run: |
          cd openwrt
          ./custom/verify-config.sh

      - name: Compile firmware
        run: |
          cd openwrt
          make -j"$(nproc)" download
          make -j"$(nproc)" V=s

      - name: Validate firmware package manifest
        run: |
          cd openwrt
          manifest="$(find bin/targets/rockchip/armv8 -maxdepth 1 -type f \
            -name '*hinlink_opc-h69k*.manifest' -print -quit)"
          test -n "$manifest"
          required_packages='
          kmod-mt7915e
          kmod-mt7916-firmware
          wpad-mbedtls
          kmod-mhi-pci-generic
          kmod-mhi-wwan-mbim
          luci-proto-mbim
          kmod-usb-net-qmi-wwan
          luci-proto-qmi
          luci-proto-ncm
          luci-app-openclash
          zerotier
          luci-app-zerotier
          qosmate
          luci-app-qosmate
          sqm-scripts
          luci-app-sqm
          sqm-autorate
          luci-app-sqm-autorate
          luci-app-modeminfo
          modeminfo
          luci-app-modemband
          modemband
          luci-app-3ginfo-lite
          luci-app-atinout
          atinout
          cpufreq
          luci-app-cpufreq
          luci-app-fancontrol'
          for package in $required_packages; do
            grep -Eq "^${package}[[:space:]]" "$manifest" || {
              echo "MISSING FROM FIRMWARE: $package" >&2
              exit 1
            }
          done
          echo "Firmware manifest validation passed: $manifest"

      - name: Upload H69K firmware
        uses: actions/upload-artifact@v4
        with:
          name: h69k-kwrt-custom-${{ github.run_number }}
          path: |
            openwrt/bin/targets/rockchip/armv8/*hinlink_opc-h69k*
            openwrt/bin/targets/rockchip/armv8/*.config
          if-no-files-found: error
          retention-days: 14
